name: Playwright SDD Tests (Local Runner)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      test_suite:
        description: 'Suite de pruebas a ejecutar'
        required: true
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'login'
          - 'home'
          - 'vehiculos'
          - 'ci:smoke'
          - 'ci:report'
      headed:
        description: 'Ejecutar con navegador visible (headed)'
        required: false
        type: boolean
        default: false

jobs:
  test:
    name: Ejecutar pruebas Playwright
    timeout-minutes: 60
    runs-on: self-hosted

    env:
      SIDO2_BASE_URL: ${{ secrets.SIDO2_BASE_URL }}
      SIDO2_USERNAME: ${{ secrets.SIDO2_USERNAME }}
      SIDO2_PASSWORD: ${{ secrets.SIDO2_PASSWORD }}
      CI: true

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar navegador Chromium de Playwright
        run: npx playwright install chromium

      - name: Ejecutar pruebas
        shell: powershell
        run: |
          $headedFlag = if ("${{ github.event.inputs.headed }}" -eq "true") { "--headed" } else { "" }
          $suite = "${{ github.event.inputs.test_suite }}"

          switch ($suite) {
            "login" {
              npx playwright test tests/login.spec.js --project=chromium $headedFlag
            }
            "home" {
              npx playwright test tests/home.spec.js --project=chromium $headedFlag
            }
            "vehiculos" {
              npx playwright test tests/partesvehiculos.spec.js --project=chromium $headedFlag
            }
            "ci:smoke" {
              npm run ci:smoke
            }
            "ci:report" {
              npm run ci:report
            }
            Default {
              npx playwright test --project=chromium $headedFlag
            }
          }

      - name: Subir Reporte HTML de Playwright
        uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: playwright-html-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14

      - name: Subir Evidencias (Screenshots, Videos y Traces)
        uses: actions/upload-artifact@v4
        if: failure()
        continue-on-error: true
        with:
          name: playwright-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14

