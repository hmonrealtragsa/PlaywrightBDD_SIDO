name: Playwright SDD Tests (Local Runner)

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:
    inputs:
      test_suite:
        description: 'Suite de pruebas a ejecutar'
        required: true
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'login'
          - 'home'
          - 'vehiculos'
          - 'ci:smoke'
          - 'ci:report'
      headed:
        description: 'Ejecutar con navegador visible (headed)'
        required: false
        type: boolean
        default: false

jobs:
  test:
    name: Ejecutar pruebas Playwright
    timeout-minutes: 60
    runs-on: self-hosted

    defaults:
      run:
        working-directory: PlaywrightSDD

    env:
      SIDO2_BASE_URL: ${{ secrets.SIDO2_BASE_URL }}
      SIDO2_USERNAME: ${{ secrets.SIDO2_USERNAME }}
      SIDO2_PASSWORD: ${{ secrets.SIDO2_PASSWORD }}
      CI: true

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: PlaywrightSDD/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar navegador Chromium de Playwright
        run: npx playwright install chromium

      - name: Ejecutar pruebas
        shell: powershell
        run: |
          $headedFlag = if ("${{ github.event.inputs.headed }}" -eq "true") { "--headed" } else { "" }
          $suite = "${{ github.event.inputs.test_suite }}"

          switch ($suite) {
            "login" {
              npx playwright test tests/login.spec.js --project=chromium $headedFlag
            }
            "home" {
              npx playwright test tests/home.spec.js --project=chromium $headedFlag
            }
            "vehiculos" {
              npx playwright test tests/partesvehiculos.spec.js --project=chromium $headedFlag
            }
            "ci:smoke" {
              npm run ci:smoke
            }
            "ci:report" {
              npm run ci:report
            }
            default {
              npx playwright test --project=chromium $headedFlag
            }
          }

      - name: Diagnostico de red y TLS
        if: always()
        shell: powershell
        run: |
          Write-Host "Variables relevantes:"
          Get-ChildItem Env: | Where-Object {
            $_.Name -match 'PROXY|NODE|SSL|TLS|GIT|ACTIONS'
          } | Sort-Object Name | Format-Table -AutoSize

          Write-Host ""
          Write-Host "Prueba Node contra endpoints de Actions:"
          node -e "require('https').get('https://github.com', r => { console.log('github.com -> ' + r.statusCode); process.exit(0); }).on('error', e => { console.error('github.com -> ' + e.message); process.exit(1); })"
          node -e "require('https').get('https://pipelines.actions.githubusercontent.com', r => { console.log('pipelines.actions.githubusercontent.com -> ' + r.statusCode); process.exit(0); }).on('error', e => { console.error('pipelines.actions.githubusercontent.com -> ' + e.message); process.exit(1); })"
          node -e "require('https').get('https://results-receiver.actions.githubusercontent.com', r => { console.log('results-receiver.actions.githubusercontent.com -> ' + r.statusCode); process.exit(0); }).on('error', e => { console.error('results-receiver.actions.githubusercontent.com -> ' + e.message); process.exit(1); })"

      - name: Subir Reporte HTML de Playwright
        uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: playwright-html-report
          path: PlaywrightSDD/playwright-report/
          retention-days: 14

      - name: Subir Evidencias (Screenshots, Videos y Traces)
        uses: actions/upload-artifact@v4
        if: failure()
        continue-on-error: true
        with:
          name: playwright-test-results
          path: PlaywrightSDD/test-results/
          retention-days: 14
