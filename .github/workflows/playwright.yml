name: Playwright SDD Tests (Local Runner)

on:
  schedule:
    - cron: '30 6 * * 1-5'  # Lunes a viernes 08:30 CEST (UTC+2)
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:
    inputs:
      test_suite:
        description: 'Suite de pruebas a ejecutar'
        required: true
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'login'
          - 'home'
          - 'vehiculos'
          - 'ci:smoke'
          - 'ci:report'
      headed:
        description: 'Ejecutar con navegador visible (headed)'
        required: false
        type: boolean
        default: false

jobs:
  test:
    name: Ejecutar pruebas Playwright
    timeout-minutes: 60
    runs-on: self-hosted

    defaults:
      run:
        working-directory: PlaywrightSDD

    env:
      SIDO2_BASE_URL: ${{ secrets.SIDO2_BASE_URL }}
      SIDO2_USERNAME: ${{ secrets.SIDO2_USERNAME }}
      SIDO2_PASSWORD: ${{ secrets.SIDO2_PASSWORD }}
      CI: true

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: PlaywrightSDD/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar navegador Chromium de Playwright
        run: npx playwright install chromium

      - name: Ejecutar pruebas
        shell: powershell
        run: |
          $headedFlag = if ("${{ github.event.inputs.headed }}" -eq "true") { "--headed" } else { "" }
          $suite = "${{ github.event.inputs.test_suite }}"
          if ([string]::IsNullOrWhiteSpace($suite)) { $suite = "all" }

          switch ($suite) {
            "login" {
              npx playwright test tests/login.spec.js --project=chromium $headedFlag
            }
            "home" {
              npx playwright test tests/home.spec.js --project=chromium $headedFlag
            }
            "vehiculos" {
              npx playwright test tests/partesvehiculos.spec.js --project=chromium $headedFlag
            }
            "ci:smoke" {
              npm run ci:smoke
            }
            "ci:report" {
              npm run ci:report
            }
            Default {
              npx playwright test --project=chromium $headedFlag
            }
          }

      - name: Resumen del job (sin subir artefactos)
        if: always()
        shell: powershell
        run: |
          $reportPath = "playwright-report"
          $evidencePath = "test-results"
          $lines = @(
            "## Resultado de Playwright",
            "",
            "- Estado del job: ${{ job.status }}",
            "- Suite: `${{ github.event.inputs.test_suite }}`",
            "- Ejecutado en: `${{ github.event_name }}`"
          )

          if (Test-Path $reportPath) {
            $lines += "- Reporte HTML generado en: `$PWD\\$reportPath`"
          } else {
            $lines += "- No se encontró el directorio del reporte HTML: `$reportPath`"
          }

          if (Test-Path $evidencePath) {
            $lines += "- Evidencias generadas en: `$PWD\\$evidencePath`"
          } else {
            $lines += "- No se encontraron evidencias en: `$evidencePath`"
          }

          $lines | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

