name: Playwright SDD Tests (Local Runner)

on:
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:
    inputs:
      test_suite:
        description: 'Suite de pruebas a ejecutar'
        required: true
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'login'
          - 'home'
          - 'vehiculos'
          - 'ci:smoke'
          - 'ci:report'
      headed:
        description: 'Ejecutar con navegador visible (headed)'
        required: false
        type: boolean
        default: false

jobs:
  test:
    name: Ejecutar pruebas Playwright
    timeout-minutes: 60
    runs-on: self-hosted

    env:
      SIDO2_BASE_URL: ${{ secrets.SIDO2_BASE_URL }}
      SIDO2_USERNAME: ${{ secrets.SIDO2_USERNAME }}
      SIDO2_PASSWORD: ${{ secrets.SIDO2_PASSWORD }}
      CI: true
      NODE_EXTRA_CA_CERTS: ${{ vars.NODE_EXTRA_CA_CERTS }}
      PLAYWRIGHT_JSON_SUMMARY: 'true'

    steps:
      - name: Validar certificado adicional de Node
        shell: powershell
        run: |
          if (-not $env:NODE_EXTRA_CA_CERTS) {
            throw "NODE_EXTRA_CA_CERTS no esta definido"
          }

          if (-not (Test-Path $env:NODE_EXTRA_CA_CERTS)) {
            throw "No existe el certificado configurado: $env:NODE_EXTRA_CA_CERTS"
          }

      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: PlaywrightSDD/package-lock.json

      - name: Instalar dependencias
        working-directory: PlaywrightSDD
        run: npm ci

      - name: Instalar navegador Chromium de Playwright
        working-directory: PlaywrightSDD
        run: npx playwright install chromium

      - name: Ejecutar pruebas
        id: ejecutar_pruebas
        shell: powershell
        working-directory: PlaywrightSDD
        run: |
          $headedFlag = if ("${{ github.event.inputs.headed }}" -eq "true") { "--headed" } else { "" }
          $suite = "${{ github.event.inputs.test_suite }}"

          switch ($suite) {
            "login" {
              npx playwright test tests/login.spec.js --project=chromium $headedFlag
            }
            "home" {
              npx playwright test tests/home.spec.js --project=chromium $headedFlag
            }
            "vehiculos" {
              npx playwright test tests/partesvehiculos.spec.js --project=chromium $headedFlag
            }
            "ci:smoke" {
              npm run ci:smoke
            }
            "ci:report" {
              npm run ci:report
            }
            default {
              npx playwright test --project=chromium $headedFlag
            }
          }

      - name: Publicar resumen de ejecucion
        if: ${{ always() && (steps.ejecutar_pruebas.outcome == 'success' || steps.ejecutar_pruebas.outcome == 'failure') }}
        shell: powershell
        working-directory: PlaywrightSDD
        run: |
          $resultsPath = Join-Path (Get-Location) 'test-results\results.json'
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          $lines = New-Object System.Collections.Generic.List[string]

          if (-not (Test-Path $resultsPath)) {
            $lines.Add("## Resumen de Playwright") | Out-Null
            $lines.Add("") | Out-Null
            $lines.Add("No se ha encontrado el fichero de resultados JSON en `test-results/results.json`.") | Out-Null
            [System.IO.File]::AppendAllText($env:GITHUB_STEP_SUMMARY, (($lines -join "`n") + "`n"), $utf8NoBom)
            exit 0
          }

          $report = Get-Content $resultsPath -Raw -Encoding utf8 | ConvertFrom-Json
          $tests = New-Object System.Collections.Generic.List[object]

          function Get-TestStatus($test) {
            if ($null -ne $test.outcome) {
              switch ($test.outcome) {
                'expected' {
                  if ($test.results | Where-Object { $_.status -eq 'passed' }) { return 'passed' }
                  if ($test.results | Where-Object { $_.status -eq 'skipped' }) { return 'skipped' }
                  return 'passed'
                }
                'flaky' { return 'flaky' }
                'skipped' { return 'skipped' }
                'unexpected' { return 'failed' }
              }
            }

            if ($test.results | Where-Object { $_.status -in @('failed', 'timedOut', 'interrupted') }) { return 'failed' }
            if ($test.results | Where-Object { $_.status -eq 'passed' }) { return 'passed' }
            if ($test.results | Where-Object { $_.status -eq 'skipped' }) { return 'skipped' }
            return 'unknown'
          }

          function Add-TestsFromSuite($suite, $titles) {
            $currentTitles = @($titles)
            if ($suite.title) {
              $currentTitles += $suite.title
            }

            if ($suite.specs) {
              foreach ($spec in $suite.specs) {
                $specTitles = @($currentTitles)
                if ($spec.title) {
                  $specTitles += $spec.title
                }

                foreach ($test in $spec.tests) {
                  $title = (($specTitles | Where-Object { $_ }) -join ' > ')
                  $title = $title -replace '^[^>]+\.spec\.js\s*>\s*', ''
                  $tests.Add([pscustomobject]@{
                    Title = $title
                    Status = Get-TestStatus $test
                  }) | Out-Null
                }
              }
            }

            if ($suite.suites) {
              foreach ($childSuite in $suite.suites) {
                Add-TestsFromSuite $childSuite $currentTitles
              }
            }
          }

          foreach ($suite in $report.suites) {
            Add-TestsFromSuite $suite @()
          }

          $passed = @($tests | Where-Object { $_.Status -eq 'passed' }).Count
          $failed = @($tests | Where-Object { $_.Status -eq 'failed' }).Count
          $flaky = @($tests | Where-Object { $_.Status -eq 'flaky' }).Count
          $skipped = @($tests | Where-Object { $_.Status -eq 'skipped' }).Count
          $total = $tests.Count
          $passRate = if ($total -gt 0) { [math]::Round(($passed / $total) * 100, 2) } else { 0 }
          $failRate = if ($total -gt 0) { [math]::Round(($failed / $total) * 100, 2) } else { 0 }

          $lines.Add("## Resumen de Playwright") | Out-Null
          $lines.Add("") | Out-Null
          $lines.Add("| Total | OK | Fallidos | % OK | % Fail |") | Out-Null
          $lines.Add("| --- | ---: | ---: | ---: | ---: |") | Out-Null
          $lines.Add("| $total | $passed | $failed | $passRate% | $failRate% |") | Out-Null
          $lines.Add("") | Out-Null
          $lines.Add("### Tests ejecutados") | Out-Null
          $lines.Add("") | Out-Null

          foreach ($test in $tests) {
            switch ($test.Status) {
              'passed' { $label = 'Test OK'; $icon = ':white_check_mark:' }
              'failed' { $label = 'Test KO'; $icon = ':x:' }
              'flaky' { $label = 'Test FLAKY'; $icon = ':warning:' }
              'skipped' { $label = 'Test SKIP'; $icon = ':fast_forward:' }
              default { $label = 'Test INFO'; $icon = ':information_source:' }
            }

            $lines.Add("- $label $icon $($test.Title)") | Out-Null
          }

          [System.IO.File]::AppendAllText($env:GITHUB_STEP_SUMMARY, (($lines -join "`n") + "`n"), $utf8NoBom)

      - name: Subir Reporte HTML de Playwright
        uses: actions/upload-artifact@v4
        if: ${{ always() && (steps.ejecutar_pruebas.outcome == 'success' || steps.ejecutar_pruebas.outcome == 'failure') }}
        with:
          name: playwright-html-report
          path: PlaywrightSDD/playwright-report/
          retention-days: 14
