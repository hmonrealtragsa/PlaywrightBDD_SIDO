name: Playwright SDD Tests (Local Runner)

on:
  schedule:
    - cron: '30 6 * * 1-5'  # Lunes a viernes 08:30 CEST (UTC+2)
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:
    inputs:
      test_suite:
        description: 'Suite de pruebas a ejecutar'
        required: true
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'login'
          - 'home'
          - 'vehiculos'
          - 'ci:smoke'
          - 'ci:report'
      headed:
        description: 'Ejecutar con navegador visible (headed)'
        required: false
        type: boolean
        default: false

jobs:
  test:
    name: Ejecutar pruebas Playwright
    timeout-minutes: 60
    runs-on: self-hosted

    defaults:
      run:
        working-directory: PlaywrightSDD

    env:
      SIDO2_BASE_URL: ${{ secrets.SIDO2_BASE_URL }}
      SIDO2_USERNAME: ${{ secrets.SIDO2_USERNAME }}
      SIDO2_PASSWORD: ${{ secrets.SIDO2_PASSWORD }}
      CI: true

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: PlaywrightSDD/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar navegador Chromium de Playwright
        run: npx playwright install chromium

      - name: Ejecutar pruebas con JUnit
        shell: powershell
        env:
          PLAYWRIGHT_JUNIT_OUTPUT_NAME: junit-results.xml
          PLAYWRIGHT_JUNIT_OUTPUT_DIR: ${{ github.workspace }}\PlaywrightSDD\test-results
        run: |
          $headedFlag = if ("${{ github.event.inputs.headed }}" -eq "true") { "--headed" } else { "" }
          $suite = "${{ github.event.inputs.test_suite }}"
          if ([string]::IsNullOrWhiteSpace($suite)) { $suite = "all" }

          switch ($suite) {
            "login" {
              npx playwright test tests/login.spec.js --project=chromium --reporter=junit,line $headedFlag
            }
            "home" {
              npx playwright test tests/home.spec.js --project=chromium --reporter=junit,line $headedFlag
            }
            "vehiculos" {
              npx playwright test tests/partesvehiculos.spec.js --project=chromium --reporter=junit,line $headedFlag
            }
            "ci:smoke" {
              npm run ci:smoke
            }
            "ci:report" {
              npm run ci:report
            }
            Default {
              npx playwright test --project=chromium --reporter=junit,line $headedFlag
            }
          }

      - name: Resumen de GitHub Actions
        if: always()
        shell: powershell
        run: |
          $xmlPath = "${{ github.workspace }}\PlaywrightSDD\test-results\junit-results.xml"
          $summary = @(
            "## Resultado de Playwright",
            "",
            "- Estado del job: ${{ job.status }}",
            "- Evento: ${{ github.event_name }}",
            "- Suite: `${{ github.event.inputs.test_suite }}`",
            "- XML: `$xmlPath`"
          )

          if (Test-Path $xmlPath) {
            $summary += "- Archivo JUnit generado correctamente"
          } else {
            $summary += "- No se encontró el archivo JUnit"
          }

          $summary += ""
          $summary += "> El reporte HTML de Playwright no se sube como artefacto para evitar el problema de Azure Blob en este runner self-hosted. Se deja un resumen en Summary y el XML de resultados para análisis."

          $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: Resolver resumen desde JUnit
        if: always()
        shell: powershell
        continue-on-error: true
        run: |
          $xmlPath = "${{ github.workspace }}\PlaywrightSDD\test-results\junit-results.xml"
          if (-not (Test-Path $xmlPath)) { exit 0 }

          [xml]$doc = Get-Content -Path $xmlPath
          $tests = [int]$doc.testsuites.tests
          $failures = [int]$doc.testsuites.failures
          $skipped = [int]$doc.testsuites.skipped
          $time = [double]$doc.testsuites.time

          $summary = @(
            "",
            "### Resumen del XML JUnit",
            "",
            "- Tests: $tests",
            "- Fallos: $failures",
            "- Omitidos: $skipped",
            "- Duración: $time s"
          )

          $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: Subir report HTML de Playwright (best effort)
        if: always()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: playwright-html-report
          path: PlaywrightSDD/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

      - name: Subir resultados JUnit y evidencias (best effort)
        if: always()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: playwright-junit-and-results
          path: |
            PlaywrightSDD/test-results/
            PlaywrightSDD/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

